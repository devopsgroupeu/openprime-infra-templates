# GitHub Actions Pipeline for Terraform Deployment
#
# Pipeline Structure:
# 1. FORMAT stage   - Format Terraform code for AWS and Kubernetes
# 2. VALIDATE stage - Validate Terraform configuration (with TFLint)
# 3. PLAN stage     - Generate Terraform plan for AWS and Kubernetes
# 4. APPLY stage    - Deploy infrastructure (manual approval required via GitHub issue)
# 5. DESTROY stage  - Destroy infrastructure (manual workflow_dispatch only, destroys K8s then AWS)

name: Terraform Deployment

on:
  push:
    # The branch the environment is configured to deliver to. A customer who
    # targets anything other than the repository default used to get a pipeline
    # that never fired, because the push landed on their branch and this filter
    # still said main (OP-235).
    # @param gitRepository.branches
    branches: ["main"]
  pull_request:
    # @param gitRepository.branches
    branches: ["main"]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      skip_final_snapshot:
        description: "Destroy without taking a final DB snapshot (data is unrecoverable)"
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: "1.11"
  TF_IN_AUTOMATION: "true"
  TF_VAR_git_repo_ssh_key: ${{ secrets.TF_VAR_GIT_REPO_SSH_KEY }}

jobs:
  # ========================================================================
  # FORMAT JOB
  # ========================================================================

  format-aws:
    name: "format:aws"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./terraform/aws

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

  format-k8s:
    name: "format:k8s"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

  # ========================================================================
  # VALIDATE JOB
  # ========================================================================

  validate-aws:
    name: "validate:aws"
    runs-on: ubuntu-latest
    needs: [format-aws]

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.61.0

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --format compact --no-color

  # ========================================================================
  # PLAN JOB
  # ========================================================================

  plan-aws:
    name: "plan:aws"
    runs-on: ubuntu-latest
    needs: [validate-aws]

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-aws
          path: ./terraform/aws/tfplan
          retention-days: 7

  # ========================================================================
  # MANUAL APPROVAL JOB - Optional gate for AWS apply and destroy
  # Included only when manual approval is enabled for the Git repository.
  # Opens a GitHub issue and waits for the configured number of approvals.
  # AWS apply and destroy jobs require this job to succeed when enabled.
  # Does not depend on GitHub Environment protection rules.
  # ========================================================================

  approve-job:
    name: "approve_action:aws"
    needs: [plan:aws]
    runs-on: ubuntu-latest
    # @section gitRepository.manualApproval.enabled begin
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (
        github.event.inputs.terraform_action == 'apply' ||
        github.event.inputs.terraform_action == 'destroy'
      )
    # @section gitRepository.manualApproval.enabled end

    # @section gitRepository.manualApproval.disabled begin
    if: false
    # @section gitRepository.manualApproval.disabled end

    permissions:
      issues: write

    steps:
      - name: Require manual approval
        uses: step-security/manual-approval@v1
        timeout-minutes: 60
        with:
          secret: ${{ github.token }}
          # @param gitRepository.manualApproval.approversCsv
          approvers: "github-user"
          # @param gitRepository.manualApproval.minimumApprovals
          minimum-approvals: 1
          issue-title: "Approve Terraform ${{ github.event.inputs.terraform_action }} for ${{ github.repository }}"
          issue-body: |
            A Terraform AWS operation requires approval.

            Operation: `${{ github.event.inputs.terraform_action }}`
            Repository: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            Requested by: @${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          exclude-workflow-initiator-as-approver: true

  # ========================================================================
  # APPLY JOB - Protected by manual approval via GitHub issue
  # Requires approval from one of: andrej-rabek, avirostek, Sbekes.
  # On push to main: runs after plan, waits for manual approval.
  # On workflow_dispatch with "apply": runs after plan, waits for approval.
  # Skipped on pull_request events.
  # Commits generated ArgoCD config files back to repo after apply.
  # ========================================================================

  apply-aws:
    name: "apply:aws"
    runs-on: ubuntu-latest
    needs:
      - plan-aws
      - approve-job

    if: github.event_name == 'workflow_dispatch' && 
        github.event.inputs.terraform_action == 'apply' &&
        needs.plan-aws.result == 'success' &&
        (
          needs.approve-job.result == 'success' ||
          needs.approve-job.result == 'skipped'
        )
    # Required-reviewer gate. Configure reviewers on the 'production'
    # environment in repo Settings -> Environments, otherwise this applies
    # without approval.
    environment: production

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      # issues: write
      contents: write

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-aws
          path: ./terraform/aws


      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        run: terraform output -json > tf-outputs-aws.json

      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v7
        with:
          name: tf-outputs-aws
          path: ./terraform/aws/tf-outputs-aws.json
          retention-days: 30
          archive: false

      - name: Commit generated ArgoCD config files
        continue-on-error: true
        run: |
          git config user.email "ci-bot@openprime.io"
          git config user.name "OpenPrime CI"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add argocd/values/ argocd/support-resources/ || true
          if git diff --cached --quiet; then
            echo "No generated ArgoCD files changed."
          else
            git commit -m "ci: regenerate ArgoCD configs from Terraform outputs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
        working-directory: ${{ github.workspace }}

  # ========================================================================
  # DESTROY AWS JOB - Manual workflow_dispatch only
  # Runs after destroy-k8s completes (with if: always() to handle skipped K8s).
  # Destroys AWS infrastructure after Kubernetes resources are removed.
  # ========================================================================

  destroy-aws:
    name: "destroy:aws"
    runs-on: ubuntu-latest
    needs:
      - destroy-k8s
      - approve-job

    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.terraform_action == 'destroy' &&
      needs.destroy-k8s.result == 'success' &&
      (
        needs.approve-job.result == 'success' ||
        needs.approve-job.result == 'skipped'
      )

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      # terraform destroy plans deletions only - it never updates an attribute
      # first. deletion_protection therefore has to be cleared by an apply, or
      # DeleteDBInstance is refused and the failure cascades to the DB subnets,
      # the internet gateway and finally the VPC. apply_immediately matters for
      # the same reason: without it the modify waits for the maintenance window.
      - name: Relax database teardown guards
        env:
          SKIP_FINAL_SNAPSHOT: ${{ inputs.skip_final_snapshot }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The rds module derives its own snapshot name; the aurora module passes
          # ours straight through and aws_rds_cluster rejects an empty one unless
          # the snapshot is skipped.
          # Default to keeping the snapshot: an empty input must not read as "skip".
          SKIP="${SKIP_FINAL_SNAPSHOT:-false}"
          SNAPSHOT_ID=""
          if [ "$SKIP" != "true" ]; then
            SNAPSHOT_ID="aurora-final-${RUN_ID}"
          fi
          terraform apply -auto-approve \
            -var rds_deletion_protection=false \
            -var rds_apply_immediately=true \
            -var rds_skip_final_snapshot="$SKIP" \
            -var aurora_deletion_protection=false \
            -var aurora_apply_immediately=true \
            -var aurora_skip_final_snapshot="$SKIP" \
            -var aurora_final_snapshot_identifier="$SNAPSHOT_ID"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

  # ========================================================================
  # VALIDATE KUBERNETES JOB
  # ========================================================================

  validate-k8s:
    name: "validate:k8s"
    runs-on: ubuntu-latest
    needs: [format-k8s]

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.61.0

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --format compact --no-color

  # ========================================================================
  # PLAN KUBERNETES JOB
  # ========================================================================

  plan-k8s:
    name: "plan:k8s"
    runs-on: ubuntu-latest
    needs: [validate-k8s, apply-aws]

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-k8s
          path: ./terraform/kubernetes/tfplan
          retention-days: 7

  # ========================================================================
  # APPLY KUBERNETES JOB - Protected by manual approval via GitHub issue
  # Runs after AWS apply completes. Waits for manual approval.
  # Requires approval from one of: andrej-rabek, avirostek, Sbekes.
  # ========================================================================

  apply-k8s:
    name: "apply:k8s"
    runs-on: ubuntu-latest
    needs: [plan-k8s, apply-aws]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply'
    # Required-reviewer gate. Configure reviewers on the 'production'
    # environment in repo Settings -> Environments, otherwise this applies
    # without approval.
    environment: production

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read
      # issues: write

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-k8s
          path: ./terraform/kubernetes


      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        run: terraform output -json > tf-outputs-k8s.json

      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v7
        with:
          name: tf-outputs-k8s
          path: ./terraform/kubernetes/tf-outputs-k8s.json
          retention-days: 30
          archive: false

  # ========================================================================
  # DESTROY KUBERNETES JOB - Manual workflow_dispatch only
  # Depends on apply-k8s (runs with if: always() to handle skipped applies).
  # Destroys Kubernetes infrastructure first, then AWS infrastructure.
  # ========================================================================

  destroy-k8s:
    name: "destroy:k8s"
    runs-on: ubuntu-latest
    needs: [apply-k8s]
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'destroy'

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
