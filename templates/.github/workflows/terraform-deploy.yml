# GitHub Actions Pipeline for Terraform Deployment
#
# Pipeline Structure:
# 1. FORMAT stage   - Format Terraform code for AWS and Kubernetes
# 2. VALIDATE stage - Validate Terraform configuration (with TFLint)
# 3. PLAN stage     - Generate Terraform plan for AWS and Kubernetes
# 4. APPLY stage    - Deploy infrastructure (manual approval required via GitHub issue)
# 5. DESTROY stage  - Destroy infrastructure (manual workflow_dispatch only, destroys K8s then AWS)

name: Terraform Deployment

on:
  push:
    # The branch the environment is configured to deliver to. A customer who
    # targets anything other than the repository default used to get a pipeline
    # that never fired, because the push landed on their branch and this filter
    # still said main (OP-235).
    # @param gitRepository.branches
    branches: ["main"]
  pull_request:
    # @param gitRepository.branches
    branches: ["main"]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      skip_final_snapshot:
        description: "Destroy without taking a final DB snapshot (data is unrecoverable)"
        required: false
        default: false
        type: boolean

# Manual runs (plan, apply, destroy) go one at a time per branch, so an apply
# and a destroy of this environment never overlap (a run can hold its saved
# plan through the 55-minute approval wait). The run in progress is never
# cancelled; of the manual runs queued behind it, GitHub keeps only the newest.
# Push and pull-request runs only plan, so each gets a group of its own: they
# never queue and so never push a waiting apply or destroy out of the queue
# (every "Push to Git" from OpenPrime starts one). If one overlaps an apply,
# Terraform waits for the state lock instead (TF_CLI_ARGS_* below).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('terraform-{0}', github.ref) || format('plan-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.11"
  TF_IN_AUTOMATION: "true"
  # Wait for the state lock instead of failing at once when two runs overlap
  # (a push plan during an apply, or an apply during a push plan). Creating
  # or destroying a cluster can hold the lock for 20 minutes or more.
  TF_CLI_ARGS_plan: "-lock-timeout=30m"
  TF_CLI_ARGS_apply: "-lock-timeout=30m"
  TF_CLI_ARGS_destroy: "-lock-timeout=30m"
  # The pipeline signs in to AWS with three roles that terraform/bootstrap
  # creates once (repository variables AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN,
  # AWS_DESTROY_ROLE_ARN), never with stored access keys. The AWS stack makes
  # the apply and destroy roles cluster and key admins.
  # @param region
  AWS_REGION: eu-west-1
  # @param terraformBackend.bucketName
  TF_STATE_BUCKET: my-terraform-state-bucket
  # Where a saved plan waits between its plan job and its apply job.
  PLAN_KEY: openprime-plans/github-${{ github.run_id }}
  TF_VAR_pipeline_apply_role_arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
  TF_VAR_pipeline_destroy_role_arn: ${{ vars.AWS_DESTROY_ROLE_ARN }}
  # The branch OpenPrime delivers to. Apply and destroy run only from it: the
  # approval script refuses any other ref before asking for approval.
  # @param gitRepository.branch
  DEPLOY_BRANCH: main

jobs:
  # ========================================================================
  # FORMAT JOB
  # ========================================================================

  format-aws:
    name: "format:aws"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./terraform/aws

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

  format-k8s:
    name: "format:k8s"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

  # ========================================================================
  # VALIDATE JOB
  # ========================================================================

  validate-aws:
    name: "validate:aws"
    runs-on: ubuntu-latest
    needs: [format-aws]

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: AWS login
        uses: ./.github/actions/aws-login
        with:
          role-variable: AWS_PLAN_ROLE_ARN
          role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Runs terraform init against the real backend.
      - name: Check backend
        working-directory: ${{ github.workspace }}
        run: sh .github/scripts/check-backend.sh terraform/aws

      # Only the backend check needs AWS; TFLint and its plugins do not get the
      # credentials.
      - name: Drop AWS credentials
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            echo "$name=" >> "$GITHUB_ENV"
          done

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.61.0

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --format compact --no-color

  # ========================================================================
  # PLAN JOB
  # ========================================================================

  plan-aws:
    name: "plan:aws"
    runs-on: ubuntu-latest
    needs: [validate-aws]
    outputs:
      plan-text-url: ${{ steps.upload-plan-text.outputs.artifact-url }}

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      contents: read
      id-token: write

    env:
      # An apply run plans with the apply role, so the plan that gets approved
      # was made by the identity that applies it. Other runs only read.
      ROLE_VARIABLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply' && 'AWS_APPLY_ROLE_ARN' || 'AWS_PLAN_ROLE_ARN' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: AWS login
        uses: ./.github/actions/aws-login
        with:
          role-variable: ${{ env.ROLE_VARIABLE }}
          role-arn: ${{ vars[env.ROLE_VARIABLE] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Export readable Terraform plan
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload readable Terraform plan
        id: upload-plan-text
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-text-aws-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./terraform/aws/tfplan.txt
          retention-days: 90
          if-no-files-found: error

      # The saved plan holds sensitive values (deploy key, generated passwords)
      # in plain text, so it never becomes an artifact. It waits in the state
      # bucket, which only the pipeline roles and account admins can read, and
      # the apply job deletes it.
      - name: Store Terraform Plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply'
        run: aws s3 cp tfplan "s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan" --only-show-errors

  # ========================================================================
  # APPLY JOB - Applies the saved AWS plan after issue approval.
  # Runs only on workflow_dispatch with "apply".
  # Requires a successful plan-aws job and issue approval inside this job.
  # Approval requires current Write, Maintain, or Admin repository access.
  # Rerun all jobs to generate a fresh plan and approval for a new attempt.
  # Commits generated ArgoCD config files back to repo after apply.
  # ========================================================================

  apply-aws:
    name: "apply:aws"
    runs-on: ubuntu-latest
    needs: [plan-aws]

    if: github.event_name == 'workflow_dispatch' && 
        github.event.inputs.terraform_action == 'apply' &&
        needs.plan-aws.result == 'success'

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      issues: write
      contents: write
      actions: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Signs in before the approval wait: a run from another branch stops here
      # (AWS trusts this role only on the deploy branch), and the stored plan
      # can be deleted whatever the approval decides.
      - name: AWS login
        id: login
        uses: ./.github/actions/aws-login
        with:
          role-variable: AWS_APPLY_ROLE_ARN
          role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          duration-seconds: 14400

      - name: Authorize AWS apply
        timeout-minutes: 60
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_SECOND_APPROVER: ${{ vars.OPENPRIME_REQUIRE_SECOND_APPROVER }}
          TF_ACTION: apply
          TF_STACK: aws
          PLAN_JOB_NAME: 'plan:aws'
          PLAN_ARTIFACT_URL: ${{ needs.plan-aws.outputs.plan-text-url }}
        run: bash .github/scripts/wait-for-approval.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Fetch Terraform Plan
        run: |
          aws s3 cp "s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan" tfplan --only-show-errors || {
            echo "::error::No stored plan for this run. It is deleted after every apply attempt: run the workflow again for a fresh plan and approval."
            exit 1
          }

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # A refused push fails the job: Argo CD would otherwise keep deploying the
      # previous values. git authenticates with the token actions/checkout
      # stored, so the token never goes into the remote URL.
      - name: Commit generated ArgoCD config files
        run: |
          git config user.email "ci-bot@openprime.io"
          git config user.name "OpenPrime CI"
          git add argocd/values/ argocd/support-resources/ || true
          if git diff --cached --quiet; then
            echo "No generated ArgoCD files changed."
          else
            git commit -m "ci: regenerate ArgoCD configs from Terraform outputs [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" || {
              echo "::error::Could not push the regenerated ArgoCD configs to $GITHUB_REF_NAME. Allow this workflow to push to the branch, then run the workflow again."
              exit 1
            }
          fi
        working-directory: ${{ github.workspace }}

      - name: Delete stored Terraform Plan
        if: always() && steps.login.outcome == 'success'
        # A leftover plan is no reason to mark a finished apply as failed.
        run: |
          aws s3 rm "s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan" --only-show-errors ||
            echo "::warning::Could not delete s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan. Delete it by hand: it holds sensitive values."

  # ========================================================================
  # DESTROY AWS JOB - Manual workflow_dispatch only
  # Runs only after destroy:k8s succeeds.
  # Waits for AWS issue approval before database teardown changes and destruction.
  # ========================================================================

  destroy-aws:
    name: "destroy:aws"
    runs-on: ubuntu-latest
    needs: [destroy-k8s]
    if: >-
      !cancelled() &&
       github.event_name == 'workflow_dispatch' && 
       github.event.inputs.terraform_action == 'destroy' &&
       needs.destroy-k8s.result == 'success'

    defaults:
      run:
        working-directory: ./terraform/aws

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: AWS login
        uses: ./.github/actions/aws-login
        with:
          role-variable: AWS_DESTROY_ROLE_ARN
          role-arn: ${{ vars.AWS_DESTROY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          duration-seconds: 14400

      - name: Authorize AWS destruction
        id: authorize
        timeout-minutes: 60
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_SECOND_APPROVER: ${{ vars.OPENPRIME_REQUIRE_SECOND_APPROVER }}
          TF_ACTION: destroy
          TF_STACK: aws
          SKIP_FINAL_SNAPSHOT: ${{ inputs.skip_final_snapshot }}
        run: bash .github/scripts/wait-for-approval.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      # Clears deletion protection on the databases in the state, and only on
      # them; the script explains why destroy cannot do this itself.
      - name: Relax database teardown guards
        id: relax
        working-directory: ${{ github.workspace }}
        env:
          SKIP_FINAL_SNAPSHOT: ${{ inputs.skip_final_snapshot }}
          RUN_ID: ${{ github.run_id }}
        run: sh .github/scripts/relax-database-guards.sh terraform/aws

      # A failed relax leaves the state's old snapshot setting in place, and
      # destroy reads it from there. So destroy continues past a failed relax
      # only when no final snapshot was requested; otherwise a database whose
      # state already says "skip" would be deleted without the snapshot the
      # approval promised. A rejected or expired approval always stops it.
      - name: Terraform Destroy
        if: ${{ !cancelled() && steps.authorize.outcome == 'success' && steps.init.outcome == 'success' && (steps.relax.outcome == 'success' || inputs.skip_final_snapshot) }}
        run: terraform destroy -auto-approve

  # ========================================================================
  # VALIDATE KUBERNETES JOB
  # ========================================================================

  validate-k8s:
    name: "validate:k8s"
    runs-on: ubuntu-latest
    needs: [format-k8s]

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: AWS login
        uses: ./.github/actions/aws-login
        with:
          role-variable: AWS_PLAN_ROLE_ARN
          role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Runs terraform init against the real backend.
      - name: Check backend
        working-directory: ${{ github.workspace }}
        run: sh .github/scripts/check-backend.sh terraform/kubernetes

      # Only the backend check needs AWS; TFLint and its plugins do not get the
      # credentials.
      - name: Drop AWS credentials
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            echo "$name=" >> "$GITHUB_ENV"
          done

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.61.0

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --format compact --no-color

  # ========================================================================
  # PLAN KUBERNETES JOB
  # ========================================================================

  plan-k8s:
    name: "plan:k8s"
    runs-on: ubuntu-latest
    needs: [validate-k8s, apply-aws]
    outputs:
      plan-text-url: ${{ steps.upload-plan-text.outputs.artifact-url }}

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_git_repo_ssh_key: ${{ secrets.TF_VAR_GIT_REPO_SSH_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Runs only in an apply run, so it plans with the apply role.
      - name: AWS login
        uses: ./.github/actions/aws-login
        with:
          role-variable: AWS_APPLY_ROLE_ARN
          role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Export readable Terraform plan
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload readable Terraform plan
        id: upload-plan-text
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-text-k8s-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./terraform/kubernetes/tfplan.txt
          retention-days: 90
          if-no-files-found: error

      # The saved plan holds sensitive values (deploy key, generated passwords)
      # in plain text, so it never becomes an artifact. It waits in the state
      # bucket, which only the pipeline roles and account admins can read, and
      # the apply job deletes it.
      - name: Store Terraform Plan
        run: aws s3 cp tfplan "s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan" --only-show-errors

  # ========================================================================
  # APPLY KUBERNETES JOB - Protected by manual approval via GitHub issue
  # Runs after AWS apply completes. Waits for manual approval.
  # Requires one issue approval from a human with Write, Maintain, or Admin access.
  # ========================================================================

  apply-k8s:
    name: "apply:k8s"
    runs-on: ubuntu-latest
    needs: [plan-k8s, apply-aws]

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.terraform_action == 'apply' &&
      needs.plan-k8s.result == 'success' &&
      needs.apply-aws.result == 'success' 

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read
      issues: write
      actions: read
      id-token: write

    env:
      TF_VAR_git_repo_ssh_key: ${{ secrets.TF_VAR_GIT_REPO_SSH_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Signs in before the approval wait: a run from another branch stops here
      # (AWS trusts this role only on the deploy branch), and the stored plan
      # can be deleted whatever the approval decides.
      - name: AWS login
        id: login
        uses: ./.github/actions/aws-login
        with:
          role-variable: AWS_APPLY_ROLE_ARN
          role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          duration-seconds: 14400

      - name: Authorize Kubernetes apply
        timeout-minutes: 60
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_SECOND_APPROVER: ${{ vars.OPENPRIME_REQUIRE_SECOND_APPROVER }}
          TF_ACTION: apply
          TF_STACK: kubernetes
          PLAN_JOB_NAME: 'plan:k8s'
          PLAN_ARTIFACT_URL: ${{ needs.plan-k8s.outputs.plan-text-url }}
        run: bash .github/scripts/wait-for-approval.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Fetch Terraform Plan
        run: |
          aws s3 cp "s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan" tfplan --only-show-errors || {
            echo "::error::No stored plan for this run. It is deleted after every apply attempt: run the workflow again for a fresh plan and approval."
            exit 1
          }

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Delete stored Terraform Plan
        if: always() && steps.login.outcome == 'success'
        # A leftover plan is no reason to mark a finished apply as failed.
        run: |
          aws s3 rm "s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan" --only-show-errors ||
            echo "::warning::Could not delete s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan. Delete it by hand: it holds sensitive values."

  # ========================================================================
  # DESTROY KUBERNETES JOB - Manual workflow_dispatch only
  # Waits for Kubernetes issue approval inside this job before destruction.
  # Runs after validate:k8s finishes, even if it fails, unless the run is cancelled.
  # Destroys Kubernetes infrastructure first, then AWS infrastructure.
  # ========================================================================

  destroy-k8s:
    name: "destroy:k8s"
    runs-on: ubuntu-latest
    needs: [validate-k8s]

    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.terraform_action == 'destroy'

    defaults:
      run:
        working-directory: ./terraform/kubernetes

    permissions:
      contents: read
      issues: write
      id-token: write

    env:
      TF_VAR_git_repo_ssh_key: ${{ secrets.TF_VAR_GIT_REPO_SSH_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: AWS login
        uses: ./.github/actions/aws-login
        with:
          role-variable: AWS_DESTROY_ROLE_ARN
          role-arn: ${{ vars.AWS_DESTROY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          duration-seconds: 14400

      - name: Authorize Kubernetes destruction
        timeout-minutes: 60
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_SECOND_APPROVER: ${{ vars.OPENPRIME_REQUIRE_SECOND_APPROVER }}
          TF_ACTION: destroy
          TF_STACK: kubernetes
        run: bash .github/scripts/wait-for-approval.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
