# GitLab CI/CD Pipeline for Terraform Deployment
#
# Pipeline Structure:
#   AWS:  format → validate → plan → apply
#   K8s:  format → validate → plan (after AWS apply) → apply
#   Destroy: destroy:k8s → destroy:aws

variables:
  TF_VERSION: "1.11"
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_IN_AUTOMATION: "true"
  # Backend configuration
  # @param terraformBackend.bucketName
  TF_STATE_BUCKET: ${TF_STATE_BUCKET}
  # Branch the customer configured in the wizard. Every rules: block compares
  # against it, so the pipeline fires on the branch the product pushes to, not
  # only on main (the GitLab half of OP-235).
  # @param gitRepository.branch
  DEPLOY_BRANCH: main

# Cache Terraform plugins between jobs for faster execution
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - ${TF_ROOT}/aws/.terraform/providers
    - ${TF_ROOT}/aws/.terraform.lock.hcl
    - ${TF_ROOT}/kubernetes/.terraform/providers
    - ${TF_ROOT}/kubernetes/.terraform.lock.hcl

# Pipeline stages — separated per layer so K8s depends on AWS
stages:
  - format
  - validate
  - plan:aws
  - apply:aws
  - plan:k8s
  - apply:k8s
  - destroy

# ========================================================================
# SHARED TEMPLATES
# ========================================================================

# Base template for AWS Terraform jobs
.terraform_base:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - cd ${TF_ROOT}/aws
    - terraform --version
    - terraform init -reconfigure

# Base template for Kubernetes Terraform jobs
.terraform_base_k8s:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - cd ${TF_ROOT}/kubernetes
    - terraform --version
    - terraform init -reconfigure

# ========================================================================
# FORMAT STAGE - Format Terraform code
# ========================================================================

format:aws:
  stage: format
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}/aws
    - terraform fmt -check -recursive
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

format:k8s:
  stage: format
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}/kubernetes
    - terraform fmt -check -recursive
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

# ========================================================================
# VALIDATE STAGE - Validate Terraform configuration
# ========================================================================

validate:aws:
  stage: validate
  needs: [format:aws]
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  variables:
    TFLINT_VERSION: "0.61.0"
  script:
    - cd ${TF_ROOT}/aws
    - terraform --version
    - (cd "$CI_PROJECT_DIR" && sh .github/scripts/check-backend.sh terraform/aws)
    - terraform validate
    - wget -qO /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
    - unzip -o /tmp/tflint.zip -d /usr/local/bin
    - tflint --init
    - tflint --format compact --no-color
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

validate:k8s:
  stage: validate
  needs: [format:k8s]
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  variables:
    TFLINT_VERSION: "0.61.0"
  script:
    - cd ${TF_ROOT}/kubernetes
    - terraform --version
    - (cd "$CI_PROJECT_DIR" && sh .github/scripts/check-backend.sh terraform/kubernetes)
    - terraform validate
    - wget -qO /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
    - unzip -o /tmp/tflint.zip -d /usr/local/bin
    - tflint --init
    - tflint --format compact --no-color
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

# ========================================================================
# PLAN AWS STAGE
# ========================================================================

plan:aws:
  extends: .terraform_base
  stage: plan:aws
  needs: [validate:aws]
  script:
    - terraform plan -out=tfplan -no-color | tee plan.txt
    - terraform show -no-color tfplan > tfplan.txt
    # The saved plan and `terraform show -json` hold sensitive values (deploy
    # key, generated passwords) in plain text, and pipeline viewers can download
    # artifacts. Publish only change counts for the MR widget, and keep an
    # encrypted plan only on the deploy branch, where apply uses it.
    - (cd "$CI_PROJECT_DIR" && sh .github/scripts/plan-summary.sh terraform/aws)
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "$DEPLOY_BRANCH" ]; then
        (cd "$CI_PROJECT_DIR" && PLAN_KEY_CONTEXT="$CI_PIPELINE_ID" sh .github/scripts/plan-crypt.sh encrypt terraform/aws)
      else
        rm -f tfplan
      fi
  artifacts:
    name: "terraform-plan-aws-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${TF_ROOT}/aws/tfplan.enc
      - ${TF_ROOT}/aws/tfplan.txt
      - ${TF_ROOT}/aws/plan.txt
    expire_in: 7 days
    reports:
      terraform: ${TF_ROOT}/aws/plan-summary.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

# ========================================================================
# APPLY AWS STAGE - Requires manual approval
# ========================================================================

apply:aws:
  extends: .terraform_base
  stage: apply:aws
  needs:
    - job: plan:aws
      artifacts: true
  # Every job that changes the environment shares this group, so GitLab runs
  # only one of them at a time, across pipelines; the others wait.
  resource_group: terraform
  environment:
    name: production
  script:
    - (cd "$CI_PROJECT_DIR" && PLAN_KEY_CONTEXT="$CI_PIPELINE_ID" sh .github/scripts/plan-crypt.sh decrypt terraform/aws)
    - terraform apply -auto-approve tfplan
    - |
      git config user.email "ci-bot@openprime.io"
      git config user.name "OpenPrime CI"
      cd ${CI_PROJECT_DIR}
      git add argocd/values/ argocd/support-resources/ || true
      if git diff --cached --quiet; then
        echo "No generated ArgoCD files changed."
      else
        git commit -m "ci: regenerate ArgoCD configs from Terraform outputs [skip ci]"
        # Needs Settings → CI/CD → Job token permissions → "Allow Git push
        # requests to the repository". A refused push fails the job: Argo CD
        # would otherwise keep deploying the previous values.
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME} || {
          echo "ERROR: Could not push the regenerated ArgoCD configs. Enable Settings → CI/CD → Job token permissions → Allow Git push requests to the repository, then run a new pipeline." >&2
          exit 1
        }
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

# ========================================================================
# PLAN K8S STAGE - Runs after AWS apply
# ========================================================================

plan:k8s:
  extends: .terraform_base_k8s
  stage: plan:k8s
  needs:
    - job: validate:k8s
    - job: apply:aws
      optional: true
  script:
    - terraform plan -out=tfplan -no-color | tee plan.txt
    - terraform show -no-color tfplan > tfplan.txt
    # The saved plan and `terraform show -json` hold sensitive values (deploy
    # key, generated passwords) in plain text, and pipeline viewers can download
    # artifacts. Publish only change counts for the MR widget, and keep an
    # encrypted plan only on the deploy branch, where apply uses it.
    - (cd "$CI_PROJECT_DIR" && sh .github/scripts/plan-summary.sh terraform/kubernetes)
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "$DEPLOY_BRANCH" ]; then
        (cd "$CI_PROJECT_DIR" && PLAN_KEY_CONTEXT="$CI_PIPELINE_ID" sh .github/scripts/plan-crypt.sh encrypt terraform/kubernetes)
      else
        rm -f tfplan
      fi
  artifacts:
    name: "terraform-plan-k8s-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${TF_ROOT}/kubernetes/tfplan.enc
      - ${TF_ROOT}/kubernetes/tfplan.txt
      - ${TF_ROOT}/kubernetes/plan.txt
    expire_in: 7 days
    reports:
      terraform: ${TF_ROOT}/kubernetes/plan-summary.json
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

# ========================================================================
# APPLY K8S STAGE - Requires manual approval, runs after AWS apply
# ========================================================================

apply:k8s:
  extends: .terraform_base_k8s
  stage: apply:k8s
  needs:
    - job: plan:k8s
      artifacts: true
    - job: apply:aws
      optional: true
  resource_group: terraform
  environment:
    name: production
  script:
    - (cd "$CI_PROJECT_DIR" && PLAN_KEY_CONTEXT="$CI_PIPELINE_ID" sh .github/scripts/plan-crypt.sh decrypt terraform/kubernetes)
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

# ========================================================================
# DESTROY STAGE - Manual destruction only
# ========================================================================

destroy:k8s:
  extends: .terraform_base_k8s
  stage: destroy
  resource_group: terraform
  environment:
    name: production
  script:
    - terraform destroy -auto-approve
  dependencies: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

destroy:aws:
  extends: .terraform_base
  stage: destroy
  resource_group: terraform
  environment:
    name: production
  script:
    # Clears deletion protection on the databases in the state, and only on
    # them; the script explains why destroy cannot do this itself. Set
    # SKIP_FINAL_SNAPSHOT=true to tear down without a final snapshot.
    - (cd "$CI_PROJECT_DIR" && RUN_ID="$CI_PIPELINE_ID" sh .github/scripts/relax-database-guards.sh terraform/aws) || relax_failed=true
    # A failed relax leaves the state's old snapshot setting in place, and
    # destroy reads it from there. So destroy continues past a failed relax
    # only when SKIP_FINAL_SNAPSHOT=true; otherwise it stops here and nothing
    # is deleted.
    - |
      if [ "${relax_failed:-}" = "true" ] && [ "${SKIP_FINAL_SNAPSHOT:-false}" != "true" ]; then
        echo "ERROR: A final snapshot was requested, but the database teardown settings could not be applied (see above). Nothing was destroyed, so no database is deleted without its snapshot." >&2
        exit 1
      fi
    - terraform destroy -auto-approve
    - |
      if [ "${relax_failed:-}" = "true" ]; then
        echo "ERROR: Relaxing the database teardown guards failed (see above). A database that kept its deletion protection was not deleted." >&2
        exit 1
      fi
  dependencies: []
  needs:
    - job: destroy:k8s
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual
