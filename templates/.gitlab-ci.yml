# GitLab CI/CD Pipeline for Terraform Deployment
#
# Pipeline Structure:
#   AWS:  format → validate → plan → apply
#   K8s:  format → validate → plan (after AWS apply) → apply
#   Destroy: destroy:k8s → destroy:aws

variables:
  TF_VERSION: "1.11"
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_IN_AUTOMATION: "true"
  # Plan jobs are not in the `terraform` resource_group, so one can overlap an
  # apply or destroy. Wait for the state lock instead of failing at once.
  # Creating or destroying a cluster can hold the lock for 20 minutes or more.
  TF_CLI_ARGS_plan: "-lock-timeout=30m"
  TF_CLI_ARGS_apply: "-lock-timeout=30m"
  TF_CLI_ARGS_destroy: "-lock-timeout=30m"
  # Backend configuration
  # @param terraformBackend.bucketName
  TF_STATE_BUCKET: ${TF_STATE_BUCKET}
  # Branch the customer configured in the wizard. Every rules: block compares
  # against it, so the pipeline fires on the branch the product pushes to, not
  # only on main (the GitLab half of OP-235).
  # @param gitRepository.branch
  DEPLOY_BRANCH: main
  # The pipeline signs in to AWS with three roles that terraform/bootstrap
  # creates once (CI/CD variables AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN,
  # AWS_DESTROY_ROLE_ARN), never with stored access keys. The AWS stack makes
  # the apply and destroy roles cluster and key admins.
  # @param region
  AWS_REGION: eu-west-1
  TF_VAR_pipeline_apply_role_arn: $AWS_APPLY_ROLE_ARN
  TF_VAR_pipeline_destroy_role_arn: $AWS_DESTROY_ROLE_ARN
  # Where a saved plan waits between its plan job and its apply job.
  PLAN_KEY: openprime-plans/gitlab-${CI_PIPELINE_ID}

# Cache Terraform plugins between jobs for faster execution
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - ${TF_ROOT}/aws/.terraform/providers
    - ${TF_ROOT}/aws/.terraform.lock.hcl
    - ${TF_ROOT}/kubernetes/.terraform/providers
    - ${TF_ROOT}/kubernetes/.terraform.lock.hcl

# Pipeline stages — separated per layer so K8s depends on AWS
stages:
  - format
  - validate
  - plan:aws
  - apply:aws
  - plan:k8s
  - apply:k8s
  - destroy

# ========================================================================
# SHARED TEMPLATES
# ========================================================================

# Every job that talks to AWS gets a GitLab ID token. aws-oidc-login.sh trades
# it for the role named in the job's AWS_ROLE_VARIABLE.
.aws_id_token:
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com

# Base template for AWS Terraform jobs
.terraform_base:
  extends: .aws_id_token
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - . "$CI_PROJECT_DIR/.github/scripts/aws-oidc-login.sh"
    - cd ${TF_ROOT}/aws
    - terraform --version
    - terraform init -reconfigure

# Base template for Kubernetes Terraform jobs
.terraform_base_k8s:
  extends: .aws_id_token
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - . "$CI_PROJECT_DIR/.github/scripts/aws-oidc-login.sh"
    - cd ${TF_ROOT}/kubernetes
    - terraform --version
    - terraform init -reconfigure

# ========================================================================
# FORMAT STAGE - Format Terraform code
# ========================================================================

format:aws:
  stage: format
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}/aws
    - terraform fmt -check -recursive
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

format:k8s:
  stage: format
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}/kubernetes
    - terraform fmt -check -recursive
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

# ========================================================================
# VALIDATE STAGE - Validate Terraform configuration
# ========================================================================

validate:aws:
  extends: .aws_id_token
  stage: validate
  needs: [format:aws]
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  variables:
    TFLINT_VERSION: "0.61.0"
    AWS_ROLE_VARIABLE: AWS_PLAN_ROLE_ARN
  script:
    - cd ${TF_ROOT}/aws
    - terraform --version
    # Only the backend check needs AWS: the role stays inside this subshell, so
    # TFLint and its plugins do not get it.
    - (cd "$CI_PROJECT_DIR" && . .github/scripts/aws-oidc-login.sh && sh .github/scripts/check-backend.sh terraform/aws)
    - terraform validate
    - wget -qO /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
    - unzip -o /tmp/tflint.zip -d /usr/local/bin
    - tflint --init
    - tflint --format compact --no-color
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

validate:k8s:
  extends: .aws_id_token
  stage: validate
  needs: [format:k8s]
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  variables:
    TFLINT_VERSION: "0.61.0"
    AWS_ROLE_VARIABLE: AWS_PLAN_ROLE_ARN
  script:
    - cd ${TF_ROOT}/kubernetes
    - terraform --version
    # Only the backend check needs AWS: the role stays inside this subshell, so
    # TFLint and its plugins do not get it.
    - (cd "$CI_PROJECT_DIR" && . .github/scripts/aws-oidc-login.sh && sh .github/scripts/check-backend.sh terraform/kubernetes)
    - terraform validate
    - wget -qO /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
    - unzip -o /tmp/tflint.zip -d /usr/local/bin
    - tflint --init
    - tflint --format compact --no-color
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

# ========================================================================
# PLAN AWS STAGE
# ========================================================================

plan:aws:
  extends: .terraform_base
  stage: plan:aws
  needs: [validate:aws]
  script:
    - terraform plan -out=tfplan -no-color | tee plan.txt
    - terraform show -no-color tfplan > tfplan.txt
    # The saved plan and `terraform show -json` hold sensitive values (deploy
    # key, generated passwords) in plain text, and pipeline viewers can download
    # artifacts. Publish only change counts for the MR widget. On the deploy
    # branch the saved plan waits in the state bucket, which only the pipeline
    # roles and account admins can read, and apply:aws deletes it.
    - (cd "$CI_PROJECT_DIR" && sh .github/scripts/plan-summary.sh terraform/aws)
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "$DEPLOY_BRANCH" ]; then
        apk add --no-cache aws-cli >/dev/null
        aws s3 cp tfplan "s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan" --only-show-errors || exit 1
      fi
      rm -f tfplan
  artifacts:
    name: "terraform-plan-aws-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${TF_ROOT}/aws/tfplan.txt
      - ${TF_ROOT}/aws/plan.txt
    expire_in: 7 days
    reports:
      terraform: ${TF_ROOT}/aws/plan-summary.json
  # On the deploy branch this plan is the one apply:aws applies, so it is made
  # by the apply role. Merge-request plans only read.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        AWS_ROLE_VARIABLE: AWS_PLAN_ROLE_ARN
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      variables:
        AWS_ROLE_VARIABLE: AWS_APPLY_ROLE_ARN

# ========================================================================
# APPLY AWS STAGE - Requires manual approval
# ========================================================================

apply:aws:
  extends: .terraform_base
  stage: apply:aws
  needs:
    - job: plan:aws
      artifacts: true
  # Every job that changes the environment shares this group, so GitLab runs
  # only one of them at a time, across pipelines; the others wait.
  resource_group: terraform
  environment:
    name: production
  variables:
    AWS_ROLE_VARIABLE: AWS_APPLY_ROLE_ARN
  script:
    - apk add --no-cache aws-cli >/dev/null
    - aws s3 cp "s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan" tfplan --only-show-errors || { echo "ERROR: No stored plan for this pipeline. It is deleted after every apply attempt; run a new pipeline for a fresh plan." >&2; exit 1; }
    - terraform apply -auto-approve tfplan || apply_failed=true
    - aws s3 rm "s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan" --only-show-errors || echo "WARNING: Could not delete s3://$TF_STATE_BUCKET/$PLAN_KEY/aws.tfplan. Delete it by hand; it holds sensitive values." >&2
    - if [ "${apply_failed:-}" = "true" ]; then exit 1; fi
    - |
      git config user.email "ci-bot@openprime.io"
      git config user.name "OpenPrime CI"
      cd ${CI_PROJECT_DIR}
      git add argocd/values/ argocd/support-resources/ || true
      if git diff --cached --quiet; then
        echo "No generated ArgoCD files changed."
      else
        git commit -m "ci: regenerate ArgoCD configs from Terraform outputs [skip ci]"
        # Needs Settings → CI/CD → Job token permissions → "Allow Git push
        # requests to the repository". A refused push fails the job: Argo CD
        # would otherwise keep deploying the previous values.
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME} || {
          echo "ERROR: Could not push the regenerated ArgoCD configs. Enable Settings → CI/CD → Job token permissions → Allow Git push requests to the repository, then run a new pipeline." >&2
          exit 1
        }
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

# ========================================================================
# PLAN K8S STAGE - Runs after AWS apply
# ========================================================================

plan:k8s:
  extends: .terraform_base_k8s
  stage: plan:k8s
  needs:
    - job: validate:k8s
    - job: apply:aws
      optional: true
  # Runs only on the deploy branch, and apply:k8s applies this plan, so it is
  # made by the apply role.
  variables:
    AWS_ROLE_VARIABLE: AWS_APPLY_ROLE_ARN
  script:
    - terraform plan -out=tfplan -no-color | tee plan.txt
    - terraform show -no-color tfplan > tfplan.txt
    # The saved plan and `terraform show -json` hold sensitive values (deploy
    # key, generated passwords) in plain text, and pipeline viewers can download
    # artifacts. Publish only change counts for the MR widget. The saved plan
    # waits in the state bucket, which only the pipeline roles and account
    # admins can read, and apply:k8s deletes it.
    - (cd "$CI_PROJECT_DIR" && sh .github/scripts/plan-summary.sh terraform/kubernetes)
    - apk add --no-cache aws-cli >/dev/null
    - aws s3 cp tfplan "s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan" --only-show-errors
    - rm -f tfplan
  artifacts:
    name: "terraform-plan-k8s-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${TF_ROOT}/kubernetes/tfplan.txt
      - ${TF_ROOT}/kubernetes/plan.txt
    expire_in: 7 days
    reports:
      terraform: ${TF_ROOT}/kubernetes/plan-summary.json
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

# ========================================================================
# APPLY K8S STAGE - Requires manual approval, runs after AWS apply
# ========================================================================

apply:k8s:
  extends: .terraform_base_k8s
  stage: apply:k8s
  needs:
    - job: plan:k8s
      artifacts: true
    - job: apply:aws
      optional: true
  resource_group: terraform
  environment:
    name: production
  variables:
    AWS_ROLE_VARIABLE: AWS_APPLY_ROLE_ARN
  script:
    - apk add --no-cache aws-cli >/dev/null
    - aws s3 cp "s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan" tfplan --only-show-errors || { echo "ERROR: No stored plan for this pipeline. It is deleted after every apply attempt; run a new pipeline for a fresh plan." >&2; exit 1; }
    - terraform apply -auto-approve tfplan || apply_failed=true
    - aws s3 rm "s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan" --only-show-errors || echo "WARNING: Could not delete s3://$TF_STATE_BUCKET/$PLAN_KEY/kubernetes.tfplan. Delete it by hand; it holds sensitive values." >&2
    - if [ "${apply_failed:-}" = "true" ]; then exit 1; fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

# ========================================================================
# DESTROY STAGE - Manual destruction only
# ========================================================================

destroy:k8s:
  extends: .terraform_base_k8s
  stage: destroy
  resource_group: terraform
  environment:
    name: production
  variables:
    AWS_ROLE_VARIABLE: AWS_DESTROY_ROLE_ARN
  script:
    - terraform destroy -auto-approve
  dependencies: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual

destroy:aws:
  extends: .terraform_base
  stage: destroy
  resource_group: terraform
  environment:
    name: production
  variables:
    AWS_ROLE_VARIABLE: AWS_DESTROY_ROLE_ARN
  script:
    # Clears deletion protection on the databases in the state, and only on
    # them; the script explains why destroy cannot do this itself. Set
    # SKIP_FINAL_SNAPSHOT=true to tear down without a final snapshot.
    - (cd "$CI_PROJECT_DIR" && RUN_ID="$CI_PIPELINE_ID" sh .github/scripts/relax-database-guards.sh terraform/aws) || relax_failed=true
    # A failed relax leaves the state's old snapshot setting in place, and
    # destroy reads it from there. So destroy continues past a failed relax
    # only when SKIP_FINAL_SNAPSHOT=true; otherwise it stops here and nothing
    # is deleted.
    - |
      if [ "${relax_failed:-}" = "true" ] && [ "${SKIP_FINAL_SNAPSHOT:-false}" != "true" ]; then
        echo "ERROR: A final snapshot was requested, but the database teardown settings could not be applied (see above). Nothing was destroyed, so no database is deleted without its snapshot." >&2
        exit 1
      fi
    - terraform destroy -auto-approve
    - |
      if [ "${relax_failed:-}" = "true" ]; then
        echo "ERROR: Relaxing the database teardown guards failed (see above). A database that kept its deletion protection was not deleted." >&2
        exit 1
      fi
  dependencies: []
  needs:
    - job: destroy:k8s
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual
