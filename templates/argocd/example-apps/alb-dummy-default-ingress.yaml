apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-dummy-default-ingress
  namespace: kube-system
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: default
    alb.ingress.kubernetes.io/actions.response-503: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"503","messageBody":"dummy ingress"}}
spec:
  ingressClassName: alb
  rules:
  # Deliberately unroutable. This rule exists only to keep the 'default' ALB group
  # alive; it must never match a real request. `.invalid` is reserved by RFC 2606
  # and can never resolve, which is the property we want - unlike the previous
  # dummy.openprime.io, which put our domain into the customer's cluster (OP-244).
  - host: dummy.invalid
    http:
      paths:
      - path: /dummy-503
        pathType: Prefix
        backend:
          service:
            name: response-503
            port:
              name: use-annotation
